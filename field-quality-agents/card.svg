    <rect x="72" y="236" width="300" height="230" rx="24" fill="#ffffff"/>
    <rect x="450" y="236" width="300" height="230" rx="24" fill="#ffffff"/>
    <rect x="828" y="236" width="300" height="230" rx="24" fill="#eff6ff"/>
    <g fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M102 267h22l12 12v33h-34zM124 267v13h12M110 291h16M110 302h12"/>
