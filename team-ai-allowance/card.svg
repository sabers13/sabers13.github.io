<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t">
  <title id="t">The allowance console showing team spend against the limit, an approved request and the audit count</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3fd"/>
      <stop offset=".6" stop-color="#e3ebf9"/>
      <stop offset="1" stop-color="#d6e2f5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1b2a4a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="190" fill="#ffffff" opacity=".35"/>

  <g filter="url(#sh)">
    <rect x="64" y="48" width="1072" height="520" rx="22" fill="#ffffff"/>
    <path d="M64 70a22 22 0 0 1 22-22h1028a22 22 0 0 1 22 22v58H64z" fill="#f7f8fa"/>
    <line x1="64" y1="128" x2="1136" y2="128" stroke="#d8dde5" stroke-width="2"/>

    <rect x="96" y="72" width="40" height="40" rx="10" fill="#2f5fd0"/>
    <text x="116" y="100" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">A</text>
    <text x="152" y="99" font-family="sans-serif" font-size="24" font-weight="700" fill="#151a21">Allowance</text>
    <text x="292" y="99" font-family="sans-serif" font-size="19" fill="#56606e">Crew</text>
    <text x="1104" y="99" text-anchor="end" font-family="sans-serif" font-size="18" fill="#56606e">System &#183; DK Console</text>

    <text x="110" y="184" font-family="sans-serif" font-size="21" fill="#56606e">Team spend this month</text>
    <text x="106" y="258" font-family="ui-monospace,Menlo,monospace" font-size="60" font-weight="700" fill="#151a21">USD 0.55</text>
    <text x="110" y="292" font-family="sans-serif" font-size="20" fill="#56606e">of USD 1.00 &#183; all limits on</text>

    <rect x="110" y="314" width="536" height="14" rx="7" fill="#e6eaf0"/>
    <rect x="110" y="314" width="295" height="14" rx="7" fill="#2f5fd0"/>

    <g font-family="sans-serif" font-size="17">
      <rect x="110" y="352" width="150" height="42" rx="21" fill="#e8eefc"/>
      <circle cx="136" cy="373" r="6" fill="#2f5fd0"/>
      <text x="154" y="379" fill="#244ea8">Budget</text>
      <rect x="272" y="352" width="176" height="42" rx="21" fill="#e8eefc"/>
      <circle cx="298" cy="373" r="6" fill="#2f5fd0"/>
      <text x="316" y="379" fill="#244ea8">Off-hours cap</text>
      <rect x="460" y="352" width="186" height="42" rx="21" fill="#e8eefc"/>
      <circle cx="486" cy="373" r="6" fill="#2f5fd0"/>
      <text x="504" y="379" fill="#244ea8">Plugin rule</text>
    </g>

    <rect x="686" y="158" width="414" height="236" rx="16" fill="#f7f8fa" stroke="#d8dde5" stroke-width="2"/>
    <text x="714" y="198" font-family="sans-serif" font-size="20" font-weight="700" fill="#151a21">At a glance</text>
    <g font-family="sans-serif" font-size="19" fill="#56606e">
      <text x="714" y="242">Accounts</text>
      <text x="1072" y="242" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="#151a21">6</text>
      <line x1="714" y1="262" x2="1072" y2="262" stroke="#e6eaf0" stroke-width="2"/>
      <text x="714" y="298">Requests filed</text>
      <text x="1072" y="298" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="#151a21">11</text>
      <line x1="714" y1="318" x2="1072" y2="318" stroke="#e6eaf0" stroke-width="2"/>
      <text x="714" y="354">Audit events</text>
      <text x="1072" y="354" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="#151a21">69</text>
    </g>

    <rect x="110" y="420" width="990" height="98" rx="14" fill="#ffffff" stroke="#d8dde5" stroke-width="2"/>
    <rect x="110" y="420" width="8" height="98" rx="4" fill="#2f5fd0"/>
    <circle cx="162" cy="469" r="24" fill="#e8eefc"/>
    <text x="162" y="476" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#244ea8">L</text>
    <text x="202" y="461" font-family="sans-serif" font-size="22" font-weight="700" fill="#151a21">Lena asks for USD 5</text>
    <text x="202" y="490" font-family="sans-serif" font-size="18" fill="#56606e">Manager partially approves USD 3 until Friday</text>
    <rect x="900" y="447" width="172" height="44" rx="22" fill="#e5f4ea"/>
    <circle cx="924" cy="469" r="6" fill="#155c33"/>
    <text x="940" y="476" font-family="sans-serif" font-size="17" font-weight="700" fill="#155c33">Approved</text>
    <text x="600" y="548" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#56606e">Provider key on the server &#183; the member cannot switch the limit off</text>
  </g>
</svg>
